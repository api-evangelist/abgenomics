aid: abgenomics
name: Abgenomics
description: 'AbGenomics (AbGenomics International, Inc.) is a clinical-stage biopharmaceutical
  company founded in 2000 with offices in the San Francisco Bay Area, California and an
  R&D center in Taipei, Taiwan. It develops targeted antibody therapeutics for immune-mediated
  inflammatory disease and cancer, built on a PSGL-1 T-cell checkpoint regulator platform,
  with clinical candidates including neihulizumab (AbGn-168H / ALTB-168) and the antibody-drug
  conjugate AbGn-107. The company rebranded as AltruBio, Inc. in 2020 and now operates at
  altrubio.com; the original abgenomics.com domain is a parked for-sale listing. It is a
  therapeutics developer, not a software vendor: it publishes no developer program, no public
  API, no SDKs and no machine-readable API description of any kind.'
